<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Job Application Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
    <div class="auth-card">
        <h1>Job Application Tracker</h1>

        <p class="auth-subtitle">Sign in to manage your applications</p>

        <h2>Login</h2>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input 
                    type="text"
                    id="username"
                    placeholder="Username"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input 
                    type="password"
                    id="password"
                    placeholder="Password"
                    required
                >
            </div>

            <button type="submit" class="primary-btn auth-btn">Login</button>
        </form>

        <p id="message" class="auth-message"></p>

        <p class="auth-link">
            Don't have an account?
            <a href="register.html">Register</a>
        </p>

    </div>

    <script>
        const API_URL = "https://job-application-tracker-api-aabd.onrender.com";
        const loginForm = document.getElementById("loginForm");

        loginForm.addEventListener("submit", async function(event) {
            event.preventDefault();

            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;
            const formData = new URLSearchParams();

            formData.append("username", username);
            formData.append("password", password);

            const response = await fetch(`${API_URL}/login`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/x-www-form-urlencoded"
                },
                body: formData
            });

        const data = await response.json();

        if(response.ok){
            localStorage.setItem("access_token", data.access_token);
            window.location.href = "dashboard.html";
        }
        else {
            document.getElementById("message").textContent = data.detail;
        }
    });
    </script>
</body>
</html>
